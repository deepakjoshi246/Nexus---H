services:
  - type: web
    name: nexus-h
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: NEXUS_H_DB_PATH
        value: /tmp/nexus_h.db
  - type: web
    name: nexus-h-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.mcp
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_ALLOWED_HOSTS
        value: nexus-h-mcp.onrender.com,nexus-h-mcp.onrender.com:*
      - key: NEXUS_H_DB_PATH
        value: /tmp/nexus_h.db
      - key: NEXUS_H_API_BASE_URL
        value: https://nexus-h.onrender.com
