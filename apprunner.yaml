version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: 3.13
  command: gunicorn --bind 0.0.0.0:8080 --workers 2 --threads 4 app:app
  network:
    port: 8080
    env: PORT
  env:
    - name: NEXUS_H_DB_PATH
      value: /tmp/nexus_h.db
